[general]
default_profile=balanced

[profile.eco]
label=Eco
cpu_governor=powersave
cpu_max=0.70
cpu_underclock=none
gpu_max=0.80
gpu_min=0.0
fan_curve=relaxed

[profile.balanced]
label=Balanced
cpu_governor=ondemand
cpu_max=0.85
cpu_underclock=none
gpu_max=1.0
gpu_min=0.0
fan_curve=moderate

[profile.performance]
label=Performance
cpu_governor=performance
cpu_max=1.0
cpu_underclock=none
gpu_max=1.0
gpu_min=1.0
fan_curve=aggressive

[fan_curve.relaxed]
label=Relaxed (qcom-fan silent)
curve=stock:silent

[fan_curve.moderate]
label=Moderate (qcom-fan auto)
curve=stock:auto

[fan_curve.aggressive]
label=Aggressive (qcom-fan aggressive)
curve=stock:aggressive

[fan]
min_pwm=0
max_pwm=100
ramp_up=0
ramp_down=0
smoothing=0
pwm_quantum=1

[suspend]
fan_safe_above=0
fan_low_pwm=0
fan_safe_pwm=0
